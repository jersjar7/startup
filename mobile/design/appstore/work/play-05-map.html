<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&display=swap">
<style>
  @page { size: 1080px 1920px; margin: 0 }

           text-transform: uppercase; padding: 16px 28px 15px;
           border-radius: 999px }

        letter-spacing: -.042em; color: #2C2C2C; max-width: 859px }

  .card { position: absolute; left: 50%; transform: translateX(-50%);
           top: 500px; width: 910px; border-radius: 38px;
           overflow: hidden; background: #FFFFFF;
           box-shadow: 0 2px 8px rgba(44,44,44,.07), 0 21px 52px rgba(44,44,44,.13) }
