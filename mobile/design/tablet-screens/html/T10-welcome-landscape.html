<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1180">
<title>Welcome, landscape</title>
<style>
@font-face{font-family:'DM Sans';font-weight:500;src:url(../../../assets/fonts/DMSans-Medium.ttf)}
@font-face{font-family:'DM Sans';font-weight:600;src:url(../../../assets/fonts/DMSans-SemiBold.ttf)}
@font-face{font-family:'DM Sans';font-weight:700;src:url(../../../assets/fonts/DMSans-Bold.ttf)}
@font-face{font-family:'DM Sans';font-weight:800;src:url(../../../assets/fonts/DMSans-ExtraBold.ttf)}
@font-face{font-family:'Inter';font-weight:400;src:url(../../../assets/fonts/Inter-Regular.ttf)}
@font-face{font-family:'Inter';font-weight:500;src:url(../../../assets/fonts/Inter-Medium.ttf)}
@font-face{font-family:'Inter';font-weight:600;src:url(../../../assets/fonts/Inter-SemiBold.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(../../../assets/fonts/JetBrainsMono-Medium.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:600;src:url(../../../assets/fonts/JetBrainsMono-SemiBold.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(../../../assets/fonts/JetBrainsMono-Bold.ttf)}
:root{--fog:#E3DFD7;--charcoal:#2C2C2C;--tile:#3A3936;--tile2:#47453F;--cream:#FFF9F0;--creamDark:#F5EDE0;--spring:#63F0A8;--springField:#63F0A8;--ember:#F0703F;--peach:#FEB89C;--butter:#F9D28A;--sunbeam:#F5B731;--forest:#2D7A5F;--muted:#6B6358;--mutedDark:#B5ADA3;--pipOff:rgba(44,44,44,0.22);--onCharcoal:#FFF9F0;--onAccent:#2C2C2C;--paper:#FDFCF8;--plinth:#CDBFA8;--sheet:#FFF9F0;--line:rgba(44,44,44,0.12);--emberBg:#FEF0EA;--forestBg:#E8F5EE;--white:#FFFFFF;--scrim:rgba(44,44,44,0.45);--grid:rgba(100,160,140,0.10);--gridFine:rgba(100,160,140,0.05);}
body{margin:0;font-family:'Inter', sans-serif;background:var(--fog);color:var(--charcoal);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
button{font-family:inherit;cursor:pointer}

</style>
</head>
<body>
<div style="width:1180px;height:820px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--fog);color:var(--charcoal);">

<div style="position:absolute;left:56px;top:52px;"><span style="font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);">FE for Raccoons</span></div>
<div style="position:absolute;left:610px;top:90px;width:290px;height:340px;"><div style="width:290px;height:340px;box-sizing:border-box;padding:24px;border-radius:34px;background:var(--spring);color:var(--onAccent);display:flex;flex-direction:column;transform:rotate(-6deg);"><span style="font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--onAccent);">Statics</span><div style="flex-grow:1;display:flex;align-items:center;justify-content:center;"><svg width="180" height="180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-9 5 9 5-9 3 9M3 17h18M8 8h10"/></svg></div></div></div>
<div style="position:absolute;left:890px;top:170px;width:250px;height:300px;"><div style="width:250px;height:300px;box-sizing:border-box;padding:24px;border-radius:34px;background:var(--peach);color:var(--onAccent);display:flex;flex-direction:column;transform:rotate(8deg);"><span style="font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--onAccent);">Fluids</span><div style="flex-grow:1;display:flex;align-items:center;justify-content:center;"><svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v10a6 6 0 0 0 12 0V4"/><path d="M6 9h4M14 11h4"/></svg></div></div></div>
<div style="position:absolute;left:700px;top:470px;width:290px;height:170px;"><div style="width:290px;height:170px;box-sizing:border-box;padding:24px;border-radius:30px;background:var(--cream);display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 40px rgba(44,44,44,0.16);transform:rotate(-2deg);"><span style="font-family:'JetBrains Mono', monospace;font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--charcoal);">Concepts</span><div style="display:flex;align-items:baseline;gap:8px;"><span style="font-family:'DM Sans', sans-serif;font-weight:800;font-size:80px;line-height:0.82;letter-spacing:-0.06em;">375</span><span style="font-family:'DM Sans', sans-serif;font-weight:700;font-size:20px;">free</span></div></div></div>
<div style="position:absolute;left:56px;top:464px;width:560px;"><h1 style="margin:0;font-family:'DM Sans', sans-serif;font-weight:800;font-size:66px;line-height:0.98;letter-spacing:-0.045em;color:var(--charcoal);text-wrap:balance;">The FE Civil,<br>one concept<br>at a time.</h1></div>
<div style="position:absolute;left:56px;top:668px;"><div style="display:flex;align-items:center;gap:28px;">
<span role="button" style="display:flex;align-items:center;justify-content:space-between;height:72px;width:440px;box-sizing:border-box;padding:0 8px 0 28px;border-radius:36px;background:var(--charcoal);color:var(--onCharcoal);">
<span style="font-family:'DM Sans', sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em;">Let's go</span>
<span style="display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:28px;background:var(--spring);color:var(--onAccent);"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
</span><span style="font-size:16px;font-weight:500;color:var(--muted);">I already have an account</span></div></div>

</div>
</body>
</html>
