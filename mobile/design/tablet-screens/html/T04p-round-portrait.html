<style>

@font-face{font-family:'Inter';font-weight:500;src:url(../../../assets/fonts/Inter-Medium.ttf)}

@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(../../../assets/fonts/JetBrainsMono-Medium.ttf)}

@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(../../../assets/fonts/JetBrainsMono-Bold.ttf)}
:root{--fog:#E3DFD7;--charcoal:#2C2C2C;--tile:#3A3936;--tile2:#47453F;--cream:#FFF9F0;--creamDark:#F5EDE0;--spring:#63F0A8;--springField:#63F0A8;--ember:#F0703F;--peach:#FEB89C;--butter:#F9D28A;--sunbeam:#F5B731;--forest:#2D7A5F;--muted:#6B6358;--mutedDark:#B5ADA3;--pipOff:rgba(44,44,44,0.22);--onCharcoal:#FFF9F0;--onAccent:#2C2C2C;--paper:#FDFCF8;--plinth:#CDBFA8;--sheet:#FFF9F0;--line:rgba(44,44,44,0.12);--emberBg:#FEF0EA;--forestBg:#E8F5EE;--white:#FFFFFF;--scrim:rgba(44,44,44,0.45);--grid:rgba(100,160,140,0.10);--gridFine:rgba(100,160,140,0.05);}
body{margin:0;font-family:'Inter', sans-serif;background:var(--fog);color:var(--charcoal);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
button{font-family:inherit;cursor:pointer}

</style>
</head>
<body>
<div style="width:820px;height:1180px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--fog);color:var(--charcoal);">

<div style="position:absolute;left:48px;top:32px;width:724px;height:48px;">
<div style="display:flex;align-items:center;gap:14px;width:724px;">
<span aria-label="Close" role="button" style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:var(--charcoal);color:var(--onCharcoal);flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></span>
<div style="display:grid;width:470px;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;"><span style="height:12px;border-radius:6px;background:var(--charcoal);"></span><span style="height:12px;border-radius:6px;background:var(--pipOff);"></span><span style="height:12px;border-radius:6px;background:var(--pipOff);"></span><span style="height:12px;border-radius:6px;background:var(--pipOff);"></span><span style="height:12px;border-radius:6px;background:var(--pipOff);"></span><span style="height:12px;border-radius:6px;background:var(--pipOff);"></span><span style="height:12px;border-radius:6px;background:var(--pipOff);"></span><span style="height:12px;border-radius:6px;background:var(--pipOff);"></span></div>
<span style="width:60px;"><span style="font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--charcoal);">2 / 8</span></span>
<span style="flex-grow:1;"></span>
<span aria-label="The concept" role="button" style="position:relative;display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:var(--cream);color:var(--charcoal);flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v16h5.5a2.5 2.5 0 0 1 2.5 2z"/></svg><span aria-hidden="true" style="position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:6px;background:var(--ember);box-shadow:0 0 0 2.5px var(--fog);"></span></span>
</div></div>
<div style="position:absolute;left:48px;top:116px;width:724px;"><div style="display:flex;flex-direction:column;gap:10px;max-width:620px;"><span style="font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ember);">Which ratio connects them</span><div style="font-size:20px;line-height:1.5;">You are 50 m from a building on level ground and you measure the angle up to its roof. You want the height.</div></div></div>
<div style="position:absolute;left:48px;top:246px;"><div style="background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px),linear-gradient(var(--gridFine) 1px, transparent 1px),linear-gradient(90deg, var(--gridFine) 1px, transparent 1px);background-size:64px 64px,64px 64px,12.8px 12.8px,12.8px 12.8px;width:724px;height:560px;border-radius:24px;position:relative;overflow:hidden;">
<svg width="724" height="560" viewBox="0 0 724 560" fill="none" style="position:absolute;inset:0;">
<path d="M73.60000000000001 486.4 L650.4 486.4 L650.4 66.24000000000001 Z" stroke="var(--charcoal)" stroke-width="4.800000000000001" stroke-linejoin="round"/>
<path d="M629.6 486.4 L629.6 465.59999999999997 L650.4 465.59999999999997" stroke="var(--muted)" stroke-width="2.5600000000000005"/>

<path d="M128 486.4 A 54.400000000000006 54.400000000000006 0 0 0 117.57096776500563 454.37010780834817" stroke="var(--ember)" stroke-width="3.84"/>
<text x="147.20000000000002" y="473.59999999999997" font-family="JetBrains Mono" font-weight="700" font-size="20.8" fill="var(--ember)">θ</text>
<text x="362" y="524.8" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="20.8" fill="var(--charcoal)">known</text>
<text x="669.6" y="276.32" font-family="DM Sans" font-weight="700" font-size="22.400000000000002" fill="var(--ember)">?</text>
</svg></div></div>
<div style="position:absolute;left:48px;top:830px;"><div style="display:flex;gap:10px;width:724px;"><span role="button" style="flex:1;display:flex;align-items:center;justify-content:center;height:68px;border-radius:14px;box-sizing:border-box;border:1px solid var(--line);background:var(--white);font-family:'DM Sans', sans-serif;font-weight:700;font-size:20px;">sin</span><span role="button" style="flex:1;display:flex;align-items:center;justify-content:center;height:68px;border-radius:14px;box-sizing:border-box;border:1px solid var(--line);background:var(--white);font-family:'DM Sans', sans-serif;font-weight:700;font-size:20px;">cos</span><span role="button" style="flex:1;display:flex;align-items:center;justify-content:center;height:68px;border-radius:14px;box-sizing:border-box;border:2px solid var(--ember);background:var(--emberBg);font-family:'DM Sans', sans-serif;font-weight:700;font-size:20px;">tan</span></div></div>
<div style="position:absolute;left:48px;top:1068px;width:724px;height:72px;"><div style="display:flex;align-items:center;gap:12px;justify-content:flex-end;"><span aria-label="Something unclear?" role="button" style="position:relative;display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:var(--cream);color:var(--charcoal);flex-shrink:0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4.5L17 13H5"/></svg></span>
<span role="button" style="display:flex;align-items:center;justify-content:space-between;height:72px;width:440px;box-sizing:border-box;padding:0 8px 0 28px;border-radius:36px;background:var(--charcoal);color:var(--onCharcoal);">
<span style="font-family:'DM Sans', sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em;">Lock it in</span>
<span style="display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:28px;background:var(--spring);color:var(--onAccent);"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
</span></div></div>

</div>
