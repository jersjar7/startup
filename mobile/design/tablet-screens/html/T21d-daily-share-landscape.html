:root{--fog:#E3DFD7;--charcoal:#2C2C2C;--tile:#3A3936;--tile2:#47453F;--cream:#FFF9F0;--creamDark:#F5EDE0;--spring:#63F0A8;--springField:#63F0A8;--ember:#F0703F;--peach:#FEB89C;--butter:#F9D28A;--sunbeam:#F5B731;--forest:#2D7A5F;--muted:#6B6358;--mutedDark:#B5ADA3;--pipOff:rgba(44,44,44,0.22);--onCharcoal:#FFF9F0;--onAccent:#2C2C2C;--paper:#FDFCF8;--plinth:#CDBFA8;--sheet:#FFF9F0;--line:rgba(44,44,44,0.12);--emberBg:#FEF0EA;--forestBg:#E8F5EE;--white:#FFFFFF;--scrim:rgba(44,44,44,0.45);--grid:rgba(100,160,140,0.10);--gridFine:rgba(100,160,140,0.05);}
body{margin:0;font-family:'Inter', sans-serif;background:var(--butter);color:var(--charcoal);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
button{font-family:inherit;cursor:pointer}

</style>

<span style="font-family:'DM Sans', sans-serif;font-size:12px;font-weight:600;letter-spacing:-0.01em;">Daily</span>
</span>
</nav><div style="position:absolute;left:0px;top:0px;width:100%;height:100%;background:var(--scrim);z-index:6;"></div>
<div style="position:absolute;left:322px;top:420px;width:640px;height:400px;z-index:7;">

<div style="align-self:center;width:44px;height:5px;border-radius:3px;background:var(--charcoal);opacity:0.25;flex-shrink:0;"></div>
<div style="display:flex;gap:32px;align-items:center;flex-grow:1;"><div style="width:320px;box-sizing:border-box;padding:28px 30px 24px;border-radius:30px;background:var(--white);box-shadow:0 18px 40px rgba(44,44,44,0.16);transform:rotate(-2deg);display:flex;flex-direction:column;gap:14px;">
<div style="display:flex;justify-content:space-between;"><span style="font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--charcoal);">FE for Raccoons</span><span style="font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);">Nov 3</span></div><h1 style="margin:0;font-family:'DM Sans', sans-serif;font-weight:800;font-size:34px;line-height:0.98;letter-spacing:-0.045em;color:var(--charcoal);text-wrap:balance;">The Daily</h1>

<div style="font-family:'JetBrains Mono', monospace;font-size:12px;color:var(--muted);">fe4raccoons.com</div></div><div style="flex-grow:1;display:flex;flex-direction:column;gap:12px;"><span role="button" style="display:flex;align-items:center;justify-content:center;height:64px;box-sizing:border-box;border-radius:32px;background:var(--charcoal);color:var(--onCharcoal);font-family:'DM Sans', sans-serif;font-weight:700;font-size:18px;">Share the picture</span><span role="button" style="display:flex;align-items:center;justify-content:center;height:64px;box-sizing:border-box;border-radius:32px;border:2px solid var(--charcoal);font-family:'DM Sans', sans-serif;font-weight:700;font-size:18px;">Copy as text</span></div></div>
</div></div>

</div>
