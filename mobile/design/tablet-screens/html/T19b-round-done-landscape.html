<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1180">
<title>Round done, landscape</title>
<style>
@font-face{font-family:'DM Sans';font-weight:500;src:url(../../../assets/fonts/DMSans-Medium.ttf)}
@font-face{font-family:'DM Sans';font-weight:600;src:url(../../../assets/fonts/DMSans-SemiBold.ttf)}
@font-face{font-family:'DM Sans';font-weight:700;src:url(../../../assets/fonts/DMSans-Bold.ttf)}
@font-face{font-family:'DM Sans';font-weight:800;src:url(../../../assets/fonts/DMSans-ExtraBold.ttf)}
@font-face{font-family:'Inter';font-weight:400;src:url(../../../assets/fonts/Inter-Regular.ttf)}
@font-face{font-family:'Inter';font-weight:500;src:url(../../../assets/fonts/Inter-Medium.ttf)}
@font-face{font-family:'Inter';font-weight:600;src:url(../../../assets/fonts/Inter-SemiBold.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(../../../assets/fonts/JetBrainsMono-Medium.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:600;src:url(../../../assets/fonts/JetBrainsMono-SemiBold.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(../../../assets/fonts/JetBrainsMono-Bold.ttf)}
:root{--fog:#E3DFD7;--charcoal:#2C2C2C;--tile:#3A3936;--tile2:#47453F;--cream:#FFF9F0;--creamDark:#F5EDE0;--spring:#63F0A8;--springField:#63F0A8;--ember:#F0703F;--peach:#FEB89C;--butter:#F9D28A;--sunbeam:#F5B731;--forest:#2D7A5F;--muted:#6B6358;--mutedDark:#B5ADA3;--pipOff:rgba(44,44,44,0.22);--onCharcoal:#FFF9F0;--onAccent:#2C2C2C;--paper:#FDFCF8;--plinth:#CDBFA8;--sheet:#FFF9F0;--line:rgba(44,44,44,0.12);--emberBg:#FEF0EA;--forestBg:#E8F5EE;--white:#FFFFFF;--scrim:rgba(44,44,44,0.45);--grid:rgba(100,160,140,0.10);--gridFine:rgba(100,160,140,0.05);--roadOn:#2C2C2C;--roadEdge:#47453F;--roadWall:#CDBFA8;--roadLine:#FFF9F0;--roadOff:#F5EDE0;--roadOffEdge:#FFF9F0;--roadOffWall:#CDBFA8;--roadShadow:rgba(44,44,44,0.22);--roadPulse:#63F0A8;}
body{margin:0;font-family:'Inter', sans-serif;background:var(--fog);color:var(--charcoal);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
button{font-family:inherit;cursor:pointer}

</style>
</head>
<body>
<div style="width:1180px;height:820px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--fog);color:var(--charcoal);">

<div style="position:absolute;left:40px;top:32px;width:48px;height:48px;"><span aria-label="Close" role="button" style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:var(--charcoal);color:var(--onCharcoal);flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></span></div>
<div style="position:absolute;left:40px;top:120px;width:560px;"><div style="display:flex;flex-direction:column;gap:12px;">
<div style="box-sizing:border-box;height:400px;padding:30px 32px;border-radius:40px;background:var(--spring);color:var(--onAccent);display:flex;flex-direction:column;justify-content:space-between;"><div style="display:flex;justify-content:space-between;"><span style="font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--onAccent);">All done</span><span style="font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--onAccent);">Perpendicular Flip</span></div>
<div style="display:flex;align-items:baseline;gap:14px;"><span style="font-family:'DM Sans', sans-serif;font-weight:800;font-size:200px;line-height:0.8;letter-spacing:-0.07em;">8</span><span style="font-family:'DM Sans', sans-serif;font-weight:700;font-size:30px;">of 8</span></div>
<div style="font-size:17px;line-height:1.5;">6 on the first try. The 2 you missed came back and you got them.</div></div>
<div style="display:flex;gap:12px;"><div style="flex:1;height:180px;box-sizing:border-box;padding:24px;border-radius:32px;background:var(--cream);display:flex;flex-direction:column;justify-content:space-between;"><span style="font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--charcoal);">First try</span><span style="font-family:'DM Sans', sans-serif;font-weight:800;font-size:76px;line-height:0.82;letter-spacing:-0.06em;">6 <span style="font-size:20px;letter-spacing:0;">of 8</span></span></div>
<div style="flex:1;height:180px;box-sizing:border-box;padding:24px;border-radius:32px;background:var(--butter);display:flex;flex-direction:column;justify-content:space-between;"><span style="font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--charcoal);">Lesson</span><span style="font-family:'DM Sans', sans-serif;font-weight:800;font-size:76px;line-height:0.82;letter-spacing:-0.06em;">1 <span style="font-size:20px;letter-spacing:0;">of 3 done</span></span></div></div></div></div>
<div style="position:absolute;left:660px;top:120px;width:480px;"><div style="display:flex;flex-direction:column;gap:16px;"><h1 style="margin:0;font-family:'DM Sans', sans-serif;font-weight:800;font-size:52px;line-height:0.98;letter-spacing:-0.045em;color:var(--charcoal);text-wrap:balance;">You can build the perpendicular by hand.</h1><div style="max-width:440px;font-size:17px;line-height:1.6;color:var(--charcoal);opacity:0.82;">Knowing the rule is not the same as solving with it. The full problems belong at a desk, on paper.</div></div></div>
<div style="position:absolute;left:660px;top:712px;width:480px;height:72px;"><div style="display:flex;align-items:center;justify-content:space-between;"><span role="link" style="font-size:16px;font-weight:500;color:var(--charcoal);text-decoration:underline;text-underline-offset:4px;">Start over</span>
<span role="button" style="display:flex;align-items:center;justify-content:space-between;height:72px;width:360px;box-sizing:border-box;padding:0 8px 0 28px;border-radius:36px;background:var(--charcoal);color:var(--onCharcoal);">
<span style="font-family:'DM Sans', sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em;">Done</span>
<span style="display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:28px;background:var(--spring);color:var(--onAccent);"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
</span></div></div>

</div>
</body>
</html>
