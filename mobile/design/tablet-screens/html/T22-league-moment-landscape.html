<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1180">
<title>League moment, landscape</title>
<style>
@font-face{font-family:'DM Sans';font-weight:500;src:url(../../../assets/fonts/DMSans-Medium.ttf)}
@font-face{font-family:'DM Sans';font-weight:600;src:url(../../../assets/fonts/DMSans-SemiBold.ttf)}
@font-face{font-family:'DM Sans';font-weight:700;src:url(../../../assets/fonts/DMSans-Bold.ttf)}
@font-face{font-family:'DM Sans';font-weight:800;src:url(../../../assets/fonts/DMSans-ExtraBold.ttf)}
@font-face{font-family:'Inter';font-weight:400;src:url(../../../assets/fonts/Inter-Regular.ttf)}
@font-face{font-family:'Inter';font-weight:500;src:url(../../../assets/fonts/Inter-Medium.ttf)}
@font-face{font-family:'Inter';font-weight:600;src:url(../../../assets/fonts/Inter-SemiBold.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(../../../assets/fonts/JetBrainsMono-Medium.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:600;src:url(../../../assets/fonts/JetBrainsMono-SemiBold.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(../../../assets/fonts/JetBrainsMono-Bold.ttf)}
:root{--fog:#E3DFD7;--charcoal:#2C2C2C;--tile:#3A3936;--tile2:#47453F;--cream:#FFF9F0;--creamDark:#F5EDE0;--spring:#63F0A8;--springField:#63F0A8;--ember:#F0703F;--peach:#FEB89C;--butter:#F9D28A;--sunbeam:#F5B731;--forest:#2D7A5F;--muted:#6B6358;--mutedDark:#B5ADA3;--pipOff:rgba(44,44,44,0.22);--onCharcoal:#FFF9F0;--onAccent:#2C2C2C;--paper:#FDFCF8;--plinth:#CDBFA8;--sheet:#FFF9F0;--line:rgba(44,44,44,0.12);--emberBg:#FEF0EA;--forestBg:#E8F5EE;--white:#FFFFFF;--scrim:rgba(44,44,44,0.45);--grid:rgba(100,160,140,0.10);--gridFine:rgba(100,160,140,0.05);}
body{margin:0;font-family:'Inter', sans-serif;background:var(--fog);color:var(--charcoal);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
button{font-family:inherit;cursor:pointer}

</style>
</head>
<body>
<div style="width:1180px;height:820px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--fog);color:var(--charcoal);">

<div style="position:absolute;left:310px;top:70px;width:560px;"><div style="width:560px;box-sizing:border-box;padding:44px 40px 40px;border-radius:44px;background:var(--cream);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;"><span style="display:flex;align-items:center;justify-content:center;width:180px;height:180px;border-radius:50%;background:#D8DADC;box-shadow:inset 0 0 0 12.857142857142858px #8E949A, 0 8px 0 var(--plinth);"><span style="display:flex;align-items:center;justify-content:center;width:122.4px;height:122.4px;border-radius:50%;border:4.5px solid #6B7177;font-family:'DM Sans', sans-serif;font-weight:800;font-size:64.8px;color:#6B7177;">S</span></span><div style="height:6px;"></div><span style="font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--forest);">Moved up</span><h1 style="margin:0;font-family:'DM Sans', sans-serif;font-weight:800;font-size:44px;line-height:0.98;letter-spacing:-0.045em;color:var(--charcoal);text-wrap:balance;text-align:center;">You moved up to Silver</h1><div style="font-size:17px;line-height:1.5;color:var(--muted);max-width:420px;">3rd of 15 in Bronze last week. A new week starts now, and everyone is back at zero.</div></div></div>
<div style="position:absolute;left:370px;top:712px;width:440px;height:72px;">
<span role="button" style="display:flex;align-items:center;justify-content:space-between;height:72px;box-sizing:border-box;padding:0 8px 0 28px;border-radius:36px;background:var(--charcoal);color:var(--onCharcoal);">
<span style="font-family:'DM Sans', sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em;">Carry on</span>
<span style="display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:28px;background:var(--spring);color:var(--onAccent);"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
</span></div>

</div>
</body>
</html>
