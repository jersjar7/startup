<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1180">
<title>Check your email, landscape</title>
<style>
@font-face{font-family:'DM Sans';font-weight:500;src:url(../../../assets/fonts/DMSans-Medium.ttf)}
@font-face{font-family:'DM Sans';font-weight:600;src:url(../../../assets/fonts/DMSans-SemiBold.ttf)}
@font-face{font-family:'DM Sans';font-weight:700;src:url(../../../assets/fonts/DMSans-Bold.ttf)}
@font-face{font-family:'DM Sans';font-weight:800;src:url(../../../assets/fonts/DMSans-ExtraBold.ttf)}
@font-face{font-family:'Inter';font-weight:400;src:url(../../../assets/fonts/Inter-Regular.ttf)}
@font-face{font-family:'Inter';font-weight:500;src:url(../../../assets/fonts/Inter-Medium.ttf)}
@font-face{font-family:'Inter';font-weight:600;src:url(../../../assets/fonts/Inter-SemiBold.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(../../../assets/fonts/JetBrainsMono-Medium.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:600;src:url(../../../assets/fonts/JetBrainsMono-SemiBold.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(../../../assets/fonts/JetBrainsMono-Bold.ttf)}
:root{--fog:#E3DFD7;--charcoal:#2C2C2C;--tile:#3A3936;--tile2:#47453F;--cream:#FFF9F0;--creamDark:#F5EDE0;--spring:#63F0A8;--springField:#63F0A8;--ember:#F0703F;--peach:#FEB89C;--butter:#F9D28A;--sunbeam:#F5B731;--forest:#2D7A5F;--muted:#6B6358;--mutedDark:#B5ADA3;--pipOff:rgba(44,44,44,0.22);--onCharcoal:#FFF9F0;--onAccent:#2C2C2C;--paper:#FDFCF8;--plinth:#CDBFA8;--sheet:#FFF9F0;--line:rgba(44,44,44,0.12);--emberBg:#FEF0EA;--forestBg:#E8F5EE;--white:#FFFFFF;--scrim:rgba(44,44,44,0.45);--grid:rgba(100,160,140,0.10);--gridFine:rgba(100,160,140,0.05);--roadOn:#2C2C2C;--roadEdge:#47453F;--roadLine:#FFF9F0;--roadOff:#F5EDE0;--roadOffEdge:#CDBFA8;--roadShadow:rgba(44,44,44,0.22);--roadPulse:#63F0A8;}
body{margin:0;font-family:'Inter', sans-serif;background:var(--fog);color:var(--charcoal);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
button{font-family:inherit;cursor:pointer}

</style>
</head>
<body>
<div style="width:1180px;height:820px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--fog);color:var(--charcoal);">

<div style="position:absolute;left:400px;top:42px;"><div style="display:flex;gap:6px;align-items:center;"><span style="width:8px;height:8px;border-radius:4px;background:var(--charcoal);opacity:0.3;"></span><span style="width:8px;height:8px;border-radius:4px;background:var(--charcoal);opacity:0.3;"></span><span style="width:34px;height:8px;border-radius:4px;background:var(--charcoal);opacity:1;"></span></div></div>
<div style="position:absolute;left:250px;top:70px;width:380px;height:380px;"><div style="width:380px;height:380px;border-radius:40px;background:var(--spring);opacity:0.5;transform:rotate(-6deg);"></div></div>
<div style="position:absolute;left:560px;top:120px;width:360px;height:360px;"><div style="width:360px;height:360px;border-radius:40px;background:var(--peach);opacity:0.6;transform:rotate(8deg);"></div></div>
<div style="position:absolute;left:270px;top:500px;width:640px;height:320px;">
<div style="width:640px;height:320px;box-sizing:border-box;padding:12px 36px 32px;border-radius:40px 40px 0 0;background:var(--sheet);display:flex;flex-direction:column;gap:18px;overflow:hidden;">
<div style="align-self:center;width:44px;height:5px;border-radius:3px;background:var(--charcoal);opacity:0.25;flex-shrink:0;"></div>

<h1 style="margin:0;font-family:'DM Sans', sans-serif;font-weight:800;font-size:44px;line-height:0.98;letter-spacing:-0.045em;color:var(--charcoal);text-wrap:balance;">Check your email.</h1>
<div style="font-size:17px;line-height:1.5;color:var(--muted);">We sent a link to <span style="color:var(--charcoal);">you@school.edu</span>. Tap it and you're in.</div>
<div style="display:flex;gap:12px;margin-top:4px;"><span role="button" style="display:flex;align-items:center;justify-content:center;height:64px;width:278px;box-sizing:border-box;border-radius:32px;background:var(--charcoal);color:var(--onCharcoal);font-family:'DM Sans', sans-serif;font-weight:700;font-size:18px;">Open email app</span><span role="button" style="display:flex;align-items:center;justify-content:center;height:64px;width:278px;box-sizing:border-box;border-radius:32px;border:2px solid var(--charcoal);font-family:'DM Sans', sans-serif;font-weight:700;font-size:18px;">Resend link</span></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;"><span role="link" style="font-size:15px;font-weight:500;color:var(--charcoal);text-decoration:underline;text-underline-offset:4px;">Wrong email? Go back</span><span style="font-size:15px;font-weight:600;color:var(--forest);">Continue to the app</span></div>
</div></div>

</div>
</body>
</html>
