<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1180">
<title>Round, landscape</title>
<style>
@font-face{font-family:'DM Sans';font-weight:500;src:url(../../../assets/fonts/DMSans-Medium.ttf)}
@font-face{font-family:'DM Sans';font-weight:600;src:url(../../../assets/fonts/DMSans-SemiBold.ttf)}
@font-face{font-family:'DM Sans';font-weight:700;src:url(../../../assets/fonts/DMSans-Bold.ttf)}
@font-face{font-family:'DM Sans';font-weight:800;src:url(../../../assets/fonts/DMSans-ExtraBold.ttf)}
@font-face{font-family:'Inter';font-weight:400;src:url(../../../assets/fonts/Inter-Regular.ttf)}
@font-face{font-family:'Inter';font-weight:500;src:url(../../../assets/fonts/Inter-Medium.ttf)}
@font-face{font-family:'Inter';font-weight:600;src:url(../../../assets/fonts/Inter-SemiBold.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(../../../assets/fonts/JetBrainsMono-Medium.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:600;src:url(../../../assets/fonts/JetBrainsMono-SemiBold.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(../../../assets/fonts/JetBrainsMono-Bold.ttf)}
:root{--fog:#E3DFD7;--charcoal:#2C2C2C;--tile:#3A3936;--tile2:#47453F;--cream:#FFF9F0;--creamDark:#F5EDE0;--spring:#63F0A8;--springField:#63F0A8;--ember:#F0703F;--peach:#FEB89C;--butter:#F9D28A;--sunbeam:#F5B731;--forest:#2D7A5F;--muted:#6B6358;--mutedDark:#B5ADA3;--pipOff:rgba(44,44,44,0.22);--onCharcoal:#FFF9F0;--onAccent:#2C2C2C;--paper:#FDFCF8;--plinth:#CDBFA8;--sheet:#FFF9F0;--line:rgba(44,44,44,0.12);--emberBg:#FEF0EA;--forestBg:#E8F5EE;--white:#FFFFFF;--scrim:rgba(44,44,44,0.45);--grid:rgba(100,160,140,0.10);--gridFine:rgba(100,160,140,0.05);--roadOn:#2C2C2C;--roadEdge:#47453F;--roadLine:#FFF9F0;--roadOff:#F5EDE0;--roadOffEdge:#CDBFA8;--roadShadow:rgba(44,44,44,0.22);--roadPulse:#63F0A8;}
body{margin:0;font-family:'Inter', sans-serif;background:var(--fog);color:var(--charcoal);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
button{font-family:inherit;cursor:pointer}

</style>
</head>
<body>
<div style="width:1180px;height:820px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--fog);color:var(--charcoal);">

<div style="position:absolute;left:40px;top:32px;width:1100px;height:48px;">
<div style="display:flex;align-items:center;gap:14px;width:1100px;">
<span aria-label="Close" role="button" style="display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:var(--charcoal);color:var(--onCharcoal);flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></span>
<div style="display:grid;width:560px;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;"><span style="height:12px;border-radius:6px;background:var(--charcoal);"></span><span style="height:12px;border-radius:6px;background:var(--pipOff);"></span><span style="height:12px;border-radius:6px;background:var(--pipOff);"></span><span style="height:12px;border-radius:6px;background:var(--pipOff);"></span><span style="height:12px;border-radius:6px;background:var(--pipOff);"></span><span style="height:12px;border-radius:6px;background:var(--pipOff);"></span><span style="height:12px;border-radius:6px;background:var(--pipOff);"></span><span style="height:12px;border-radius:6px;background:var(--pipOff);"></span></div>
<span style="width:60px;"><span style="font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--charcoal);">2 / 8</span></span>
<span style="flex-grow:1;"></span>
<span aria-label="The concept" role="button" style="position:relative;display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:var(--cream);color:var(--charcoal);flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v16h5.5a2.5 2.5 0 0 1 2.5 2z"/></svg><span aria-hidden="true" style="position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:6px;background:var(--ember);box-shadow:0 0 0 2.5px var(--fog);"></span></span>
</div></div>
<div style="position:absolute;left:40px;top:120px;"><div style="background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px),linear-gradient(var(--gridFine) 1px, transparent 1px),linear-gradient(90deg, var(--gridFine) 1px, transparent 1px);background-size:60px 60px,60px 60px,12px 12px,12px 12px;width:640px;height:664px;border-radius:24px;position:relative;overflow:hidden;">
<svg width="640" height="664" viewBox="0 0 640 664" fill="none" style="position:absolute;inset:0;">
<path d="M69 595 L571 595 L571 62.1 Z" stroke="var(--charcoal)" stroke-width="4.5" stroke-linejoin="round"/>
<path d="M551.5 595 L551.5 575.5 L571 575.5" stroke="var(--muted)" stroke-width="2.4000000000000004"/>

<path d="M120 595 A 51 51 0 0 0 103.97011046039682 557.877346883774" stroke="var(--ember)" stroke-width="3.5999999999999996"/>
<text x="138" y="583" font-family="JetBrains Mono" font-weight="700" font-size="19.5" fill="var(--ember)">θ</text>
<text x="320" y="631" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="19.5" fill="var(--charcoal)">known</text>
<text x="589" y="328.55" font-family="DM Sans" font-weight="700" font-size="21" fill="var(--ember)">?</text>
</svg></div></div>
<div style="position:absolute;left:720px;top:120px;width:420px;height:664px;">
<div style="height:100%;display:flex;flex-direction:column;">
<div style="display:flex;flex-direction:column;gap:10px;"><span style="font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ember);">Which ratio connects them</span>
<div style="font-size:20px;line-height:1.5;color:var(--charcoal);">You are 50 m from a building on level ground and you measure the angle up to its roof. You want the height.</div></div>
<div style="height:24px;"></div>
<div style="display:flex;gap:10px;width:420px;"><span role="button" style="flex:1;display:flex;align-items:center;justify-content:center;height:88px;border-radius:20px;box-sizing:border-box;border:1px solid var(--line);background:var(--white);font-family:'DM Sans', sans-serif;font-weight:700;font-size:26px;">sin</span><span role="button" style="flex:1;display:flex;align-items:center;justify-content:center;height:88px;border-radius:20px;box-sizing:border-box;border:1px solid var(--line);background:var(--white);font-family:'DM Sans', sans-serif;font-weight:700;font-size:26px;">cos</span><span role="button" style="flex:1;display:flex;align-items:center;justify-content:center;height:88px;border-radius:20px;box-sizing:border-box;border:2px solid var(--ember);background:var(--emberBg);font-family:'DM Sans', sans-serif;font-weight:700;font-size:26px;">tan</span></div>

<div style="flex-grow:1;"></div>
<div style="display:flex;align-items:center;gap:12px;justify-content:flex-end;"><span aria-label="Something unclear?" role="button" style="position:relative;display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:var(--cream);color:var(--charcoal);flex-shrink:0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4.5L17 13H5"/></svg></span>
<span role="button" style="display:flex;align-items:center;justify-content:space-between;height:72px;width:360px;box-sizing:border-box;padding:0 8px 0 28px;border-radius:36px;background:var(--charcoal);color:var(--onCharcoal);">
<span style="font-family:'DM Sans', sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em;">Lock it in</span>
<span style="display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:28px;background:var(--spring);color:var(--onAccent);"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
</span></div>
</div></div>

</div>
</body>
</html>
