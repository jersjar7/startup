<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1180">
<title>Account sheet, landscape</title>
<style>
@font-face{font-family:'DM Sans';font-weight:500;src:url(../../../assets/fonts/DMSans-Medium.ttf)}
@font-face{font-family:'DM Sans';font-weight:600;src:url(../../../assets/fonts/DMSans-SemiBold.ttf)}
@font-face{font-family:'DM Sans';font-weight:700;src:url(../../../assets/fonts/DMSans-Bold.ttf)}
@font-face{font-family:'DM Sans';font-weight:800;src:url(../../../assets/fonts/DMSans-ExtraBold.ttf)}
@font-face{font-family:'Inter';font-weight:400;src:url(../../../assets/fonts/Inter-Regular.ttf)}
@font-face{font-family:'Inter';font-weight:500;src:url(../../../assets/fonts/Inter-Medium.ttf)}
@font-face{font-family:'Inter';font-weight:600;src:url(../../../assets/fonts/Inter-SemiBold.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(../../../assets/fonts/JetBrainsMono-Medium.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:600;src:url(../../../assets/fonts/JetBrainsMono-SemiBold.ttf)}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(../../../assets/fonts/JetBrainsMono-Bold.ttf)}
:root{--fog:#E3DFD7;--charcoal:#2C2C2C;--tile:#3A3936;--tile2:#47453F;--cream:#FFF9F0;--creamDark:#F5EDE0;--spring:#63F0A8;--springField:#63F0A8;--ember:#F0703F;--peach:#FEB89C;--butter:#F9D28A;--sunbeam:#F5B731;--forest:#2D7A5F;--muted:#6B6358;--mutedDark:#B5ADA3;--pipOff:rgba(44,44,44,0.22);--onCharcoal:#FFF9F0;--onAccent:#2C2C2C;--paper:#FDFCF8;--plinth:#CDBFA8;--sheet:#FFF9F0;--line:rgba(44,44,44,0.12);--emberBg:#FEF0EA;--forestBg:#E8F5EE;--white:#FFFFFF;--scrim:rgba(44,44,44,0.45);--grid:rgba(100,160,140,0.10);--gridFine:rgba(100,160,140,0.05);}
body{margin:0;font-family:'Inter', sans-serif;background:var(--fog);color:var(--charcoal);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--ember);outline-offset:3px}
button{font-family:inherit;cursor:pointer}

</style>
</head>
<body>
<div style="width:1180px;height:820px;box-sizing:border-box;position:relative;overflow:hidden;background:var(--fog);color:var(--charcoal);">

<nav aria-label="Main" style="position:absolute;left:0;top:0;width:104px;height:820px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;border-radius:0 40px 40px 0;background:var(--cream);box-shadow:6px 0 30px rgba(44,44,44,0.10);z-index:5;">

<span role="link" aria-label="Profile" aria-current="page" style="display:flex;flex-direction:column;align-items:center;gap:4px;width:104px;color:var(--charcoal);">
<span style="position:relative;display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:27px;background:var(--spring);color:var(--onAccent);"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-4 4-5.5 7-5.5s6 1.5 7 5.5z"/></svg></span>
<span style="font-family:'DM Sans', sans-serif;font-size:12px;font-weight:600;letter-spacing:-0.01em;">Profile</span>
</span>

<span role="link" aria-label="Study" style="display:flex;flex-direction:column;align-items:center;gap:4px;width:104px;color:var(--muted);">
<span style="position:relative;display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:27px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v16h5.5a2.5 2.5 0 0 1 2.5 2z"/></svg></span>
<span style="font-family:'DM Sans', sans-serif;font-size:12px;font-weight:600;letter-spacing:-0.01em;">Study</span>
</span>

<span role="link" aria-label="Daily" style="display:flex;flex-direction:column;align-items:center;gap:4px;width:104px;color:var(--muted);">
<span style="position:relative;display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:27px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="none"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></span>
<span style="font-family:'DM Sans', sans-serif;font-size:12px;font-weight:600;letter-spacing:-0.01em;">Daily</span>
</span>
</nav>
<div style="position:absolute;left:136px;top:36px;width:1004px;height:52px;"><div style="display:flex;align-items:center;justify-content:space-between;height:52px;gap:20px;"><span style="font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);">Tuesday, Nov 3</span><span role="button" aria-label="Account" style="display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:26px;background:var(--charcoal);color:var(--onCharcoal);font-family:'DM Sans', sans-serif;font-weight:700;font-size:18px;">J</span></div></div>
<div style="position:absolute;left:136px;top:128px;width:460px;"><h1 style="margin:0;font-family:'DM Sans', sans-serif;font-weight:800;font-size:96px;line-height:0.98;letter-spacing:-0.045em;color:var(--charcoal);text-wrap:balance;">Welcome back, Jerson.</h1></div><div style="position:absolute;left:0px;top:0px;width:100%;height:100%;background:var(--scrim);z-index:6;"></div>
<div style="position:absolute;left:322px;top:220px;width:640px;height:600px;z-index:7;">
<div style="width:640px;height:600px;box-sizing:border-box;padding:12px 36px 32px;border-radius:40px 40px 0 0;background:var(--sheet);display:flex;flex-direction:column;gap:18px;overflow:hidden;">
<div style="align-self:center;width:44px;height:5px;border-radius:3px;background:var(--charcoal);opacity:0.25;flex-shrink:0;"></div>

<div style="display:flex;align-items:center;gap:16px;"><span style="display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:26px;background:var(--charcoal);color:var(--onCharcoal);font-family:'DM Sans', sans-serif;font-weight:700;font-size:18px;">J</span><span style="flex-grow:1;font-family:'DM Sans', sans-serif;font-weight:700;font-size:24px;">j@x.edu</span><span aria-label="Edit profile" role="button" style="position:relative;display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:var(--creamDark);color:var(--charcoal);flex-shrink:0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></span><span aria-label="More" role="button" style="position:relative;display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:24px;background:var(--creamDark);color:var(--charcoal);flex-shrink:0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></span></div>
<div style="display:flex;gap:10px;"><div style="flex:1;box-sizing:border-box;padding:16px 18px;border-radius:20px;background:var(--creamDark);display:flex;flex-direction:column;gap:8px;"><span style="font-family:'JetBrains Mono', monospace;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);">Total XP</span><span style="font-family:'DM Sans', sans-serif;font-weight:800;font-size:34px;letter-spacing:-0.04em;">1,240</span></div><div style="flex:1;box-sizing:border-box;padding:16px 18px;border-radius:20px;background:var(--creamDark);display:flex;flex-direction:column;gap:8px;"><span style="font-family:'JetBrains Mono', monospace;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);">Badges</span><span style="font-family:'DM Sans', sans-serif;font-weight:800;font-size:34px;letter-spacing:-0.04em;">2</span></div><div style="flex:1;box-sizing:border-box;padding:16px 18px;border-radius:20px;background:var(--creamDark);display:flex;flex-direction:column;gap:8px;"><span style="font-family:'JetBrains Mono', monospace;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);">Concepts</span><span style="font-family:'DM Sans', sans-serif;font-weight:800;font-size:34px;letter-spacing:-0.04em;">9</span></div></div>
<div style="display:flex;align-items:center;justify-content:space-between;height:56px;"><span style="font-size:17px;font-weight:500;">Appearance</span><div style="display:flex;gap:4px;"><span style="display:flex;align-items:center;height:40px;padding:0 16px;border-radius:20px;background:var(--charcoal);color:var(--spring);font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;">Auto</span><span style="display:flex;align-items:center;height:40px;padding:0 16px;border-radius:20px;color:var(--muted);font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;">Light</span><span style="display:flex;align-items:center;height:40px;padding:0 16px;border-radius:20px;color:var(--muted);font-family:'JetBrains Mono', monospace;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;">Dark</span></div></div>
<div style="display:flex;align-items:center;justify-content:space-between;height:44px;"><span style="font-size:17px;font-weight:500;">Study reminders</span><span style="display:inline-block;position:relative;width:52px;height:30px;border-radius:15px;background:var(--creamDark);"><span style="position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:11px;background:var(--muted);"></span></span></div>
<div style="flex-grow:1;"></div>
<span role="button" style="display:flex;align-items:center;justify-content:center;height:64px;box-sizing:border-box;border-radius:32px;background:var(--charcoal);color:var(--onCharcoal);font-family:'DM Sans', sans-serif;font-weight:700;font-size:18px;">Open the website</span>
<div style="display:flex;gap:12px;"><span role="button" style="display:flex;align-items:center;justify-content:center;height:64px;width:278px;box-sizing:border-box;border-radius:32px;border:2px solid var(--charcoal);font-family:'DM Sans', sans-serif;font-weight:700;font-size:18px;">How it works</span><span role="button" style="display:flex;align-items:center;justify-content:center;height:64px;width:278px;box-sizing:border-box;border-radius:32px;border:2px solid var(--charcoal);font-family:'DM Sans', sans-serif;font-weight:700;font-size:18px;">Sign out</span></div>
<div style="text-align:center;font-family:'JetBrains Mono', monospace;font-size:12px;color:var(--muted);">Version 1.3.0</div>
</div></div>

</div>
</body>
</html>
