<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Account sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;background:#E3DFD7;color:#2C2C2C;-webkit-font-smoothing:antialiased}
a{color:#2C2C2C}a:hover{color:#2C2C2C}
a:focus-visible,button:focus-visible{outline:3px solid #F0703F;outline-offset:3px}
button{font-family:inherit;cursor:pointer}
button:active,a:active{transform:scale(0.95)}
input::placeholder{color:#8C8377}input:focus{outline:none}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #E3DFD7; color: #2C2C2C;">

<div aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.35; background: #E3DFD7;"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 24px 34px; border-radius: 40px 40px 0 0; background: #FFF9F0; color: #2C2C2C; display: flex; flex-direction: column; gap: 22px; animation: sheetUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;">
<div style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #2C2C2C; opacity: 0.25;"></div>
<div style="display: flex; align-items: center; gap: 14px;">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 28px; background: #2C2C2C; color: #FFF9F0; font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 18px;">JG</span>
<span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.03em;">Jerson Garcia</span><span style="font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 12px; color: #6B6358;">jerson@example.com</span></span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
<div style="display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; padding: 14px; border-radius: 22px; background: #F5EDE0;"><span style="font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6358;">Total XP</span><span style="font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 26px; line-height: 0.9; letter-spacing: -0.04em;">1,240</span></div><div style="display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; padding: 14px; border-radius: 22px; background: #F5EDE0;"><span style="font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6358;">Badges</span><span style="font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 26px; line-height: 0.9; letter-spacing: -0.04em;">3</span></div><div style="display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; padding: 14px; border-radius: 22px; background: #F5EDE0;"><span style="font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6358;">Concepts</span><span style="font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 26px; line-height: 0.9; letter-spacing: -0.04em;">14</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px;">
<a href="#website" style="display: flex; align-items: center; justify-content: center; height: 64px; border-radius: 32px; background: #2C2C2C; color: #FFF9F0; font-weight: 600; font-size: 17px; text-decoration: none;">Open the website</a>
<a href="04-exam-date.html" style="display: flex; align-items: center; justify-content: center; height: 64px; box-sizing: border-box; border-radius: 32px; border: 2px solid #2C2C2C; color: #2C2C2C; font-weight: 600; font-size: 17px; text-decoration: none;">Set your exam date</a>
<a href="01-welcome.html" style="display: flex; align-items: center; justify-content: center; height: 64px; box-sizing: border-box; border-radius: 32px; border: 2px solid #2C2C2C; color: #2C2C2C; font-weight: 600; font-size: 17px; text-decoration: none;">Sign out</a>
</div>
<a href="#delete" style="align-self: center; font-size: 14px; font-weight: 600; color: #D64045; text-decoration: underline; text-underline-offset: 4px;">Delete account</a>
</div>
</div>
</body>
</html>
