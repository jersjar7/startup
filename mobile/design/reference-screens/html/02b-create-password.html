<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Create account: password</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;background:#63F0A8;color:#2C2C2C;-webkit-font-smoothing:antialiased}
a{color:#2C2C2C}a:hover{color:#2C2C2C}
a:focus-visible,button:focus-visible{outline:3px solid #F0703F;outline-offset:3px}
button{font-family:inherit;cursor:pointer}
button:active,a:active{transform:scale(0.95)}
input::placeholder{color:#8C8377}input:focus{outline:none}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}

</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #63F0A8; color: #2C2C2C;">

<div style="box-sizing: border-box; padding: 56px 24px 0; display: flex; flex-direction: column; gap: 30px;">
<div style="display: flex; align-items: center; gap: 14px;"><a href="02-create-email.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-left: -4px; border-radius: 24px; background: #2C2C2C; color: #FFF9F0; text-decoration: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a><div style="flex-grow: 1; display: flex; gap: 6px;" aria-label="Step 2 of 3"><div style="width: 8px; height: 8px; border-radius: 4px; background: #2C2C2C; opacity: 0.35;"></div><div style="width: 36px; height: 8px; border-radius: 4px; background: #2C2C2C; opacity: 1;"></div><div style="width: 8px; height: 8px; border-radius: 4px; background: #2C2C2C; opacity: 0.35;"></div></div></div>
<h1 style="margin: 0; font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 48px; line-height: 0.98; letter-spacing: -0.045em; color: #2C2C2C; text-wrap: balance;">Pick a<br>password.</h1>

<div style="display: flex; flex-direction: column; gap: 12px;">
<label for="ca-password" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Password</label>
<input id="ca-password" type="password" placeholder="••••••••" style="width: 100%; box-sizing: border-box; height: 64px; padding: 0; border: none; border-bottom: 3px solid #2C2C2C; border-radius: 0; background: transparent; color: #2C2C2C; caret-color: #2C2C2C; font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.03em;">
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6B6358;">Eight characters or more. You can reset it by email any time.</p>
</div>
<div style="display: flex; align-items: center; justify-content: flex-end;">
<a href="02c-check-email.html" aria-label="Create account" style="display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 36px; background: #2C2C2C; color: #63F0A8; text-decoration: none;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
</div>
</div>
</div>
</body>
</html>
