<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Forgot password</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;background:#E3DFD7;color:#2C2C2C;-webkit-font-smoothing:antialiased}
a{color:#2C2C2C}a:hover{color:#2C2C2C}
a:focus-visible,button:focus-visible{outline:3px solid #F0703F;outline-offset:3px}
button{font-family:inherit;cursor:pointer}
button:active,a:active{transform:scale(0.95)}
input::placeholder{color:#8C8377}input:focus{outline:none}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}

</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #E3DFD7; color: #2C2C2C;">

<div style="position: relative; box-sizing: border-box; padding: 56px 24px 0; display: flex; flex-direction: column; gap: 30px;">
<a href="03-log-in.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; margin-left: -4px; border-radius: 24px; background: #2C2C2C; color: #FFF9F0; text-decoration: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 48px; line-height: 0.98; letter-spacing: -0.045em; color: #2C2C2C; text-wrap: balance;">Reset your<br><span style="color: #2D7A5F;">password.</span></h1>

<div style="display: flex; flex-direction: column; gap: 12px;">
<label for="fp-email" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Email</label>
<input id="fp-email" type="email" placeholder="you@school.edu" style="width: 100%; box-sizing: border-box; height: 64px; padding: 0; border: none; border-bottom: 3px solid #2D7A5F; border-radius: 0; background: transparent; color: #2C2C2C; caret-color: #2D7A5F; font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.03em;">
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6B6358;">We'll email you a reset link.</p>
</div>
<div style="display: flex; align-items: center; justify-content: space-between;">
<a href="03-log-in.html" style="display: flex; align-items: center; height: 48px; font-size: 15px; font-weight: 600; color: #2C2C2C; text-decoration: underline; text-underline-offset: 4px;">Back to log in</a>
<a href="03-log-in.html" aria-label="Send reset link" style="display: flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 36px; background: #2C2C2C; color: #63F0A8; text-decoration: none;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
</div>
</div>
</div>
</body>
</html>
