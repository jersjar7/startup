<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Feedback sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700;9..40,800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Inter', 'Helvetica Neue', Arial, sans-serif;background:#E3DFD7;color:#2C2C2C;-webkit-font-smoothing:antialiased}
a{color:#2C2C2C}a:hover{color:#2C2C2C}
a:focus-visible,button:focus-visible{outline:3px solid #F0703F;outline-offset:3px}
button{font-family:inherit;cursor:pointer}
button:active,a:active{transform:scale(0.95)}
input::placeholder{color:#8C8377}input:focus{outline:none}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes sheetUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #E3DFD7; color: #2C2C2C;">

<div aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.35; background: #E3DFD7;"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 24px 34px; border-radius: 40px 40px 0 0; background: #FFF9F0; color: #2C2C2C; display: flex; flex-direction: column; gap: 22px; animation: sheetUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;">
<div style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #2C2C2C; opacity: 0.25;"></div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6B6358;">Set it up · round 3</span>
<h1 style="margin: 0; font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 38px; line-height: 0.98; letter-spacing: -0.045em; color: #2C2C2C; text-wrap: balance;">Something unclear?</h1>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap;"><button type="button" aria-pressed="true" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border: none; border-radius: 22px; font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: -0.02em; background: #2C2C2C; color: #FFF9F0;">The explanation</button><button type="button" aria-pressed="false" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border: none; border-radius: 22px; font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: -0.02em; background: #F5EDE0; color: #2C2C2C;">The game</button><button type="button" aria-pressed="false" style="display: flex; align-items: center; height: 44px; padding: 0 18px; border: none; border-radius: 22px; font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: -0.02em; background: #F5EDE0; color: #2C2C2C;">The answer</button></div>
<div style="display: flex; flex-direction: column; gap: 10px;">
<div style="font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.03em; line-height: 1.2; color: #8C8377; padding: 6px 0 10px; border-bottom: 3px solid #2D7A5F;">What tripped you up?</div>
<div style="font-size: 14px; color: #6B6358;">We read every one. Your round and game come along, so you can keep it short.</div>
</div>

<a href="13b-game-answered.html" style="display: flex; align-items: center; justify-content: space-between; height: 72px; box-sizing: border-box; padding: 0 8px 0 28px; border-radius: 36px; background: #2C2C2C; color: #FFF9F0; text-decoration: none;">
<span style="font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em;">Send it</span>
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 28px; background: #63F0A8; color: #2C2C2C;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span>
</a>
</div>
</div>
</body>
</html>
