# First-run journey: promise → exam date → pace → diagnostic → Today.
appId: com.fe4raccoons.mobile
name: 01 Onboarding
---
- launchApp:
    clearState: true
- assertVisible: "How this works"
- takeScreenshot: 01-howitworks
- tapOn: "Get started"

- assertVisible: "When's your exam?"
- tapOn: "About 2 months away"
- tapOn: "Continue"

- assertVisible: "Your daily pace"
- takeScreenshot: 02-pace
- tapOn: "Start"

- assertVisible: "Skip" # diagnostic loaded (header is uppercase via Overline)
- takeScreenshot: 03-diagnostic
- tapOn: "Skip"

- assertVisible: "Your review"
- takeScreenshot: 04-today
