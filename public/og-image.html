<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #FFF9F0;
    font-family: 'DM Sans', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card {
    width: 1080px;
    height: 510px;
    background: #FFFFFF;
    border-radius: 24px;
    box-shadow: 0 2px 6px rgba(44,44,44,0.04), 0 8px 32px rgba(44,44,44,0.08);
    padding: 60px 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-top: 5px solid #E8683A;
  }
  .logo {
    font-size: 28px;
    font-weight: 700;
    color: #2C2C2C;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
  }
  .logo span { color: #E8683A; }
  h1 {
    font-size: 52px;
    font-weight: 700;
    color: #2C2C2C;
    letter-spacing: -0.04em;
    line-height: 1.15;
    margin-bottom: 20px;
  }
  h1 em {
    color: #E8683A;
    font-style: normal;
  }
  p {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 22px;
    color: #7A766D;
    line-height: 1.5;
    margin-bottom: 32px;
  }
  .stats {
    display: flex;
    gap: 40px;
  }
  .stat {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .stat-num {
    font-size: 32px;
    font-weight: 700;
    color: #2D7A5F;
    letter-spacing: -0.02em;
  }
  .stat-label {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px;
    color: #A09C93;
    font-weight: 500;
  }
  .url {
    position: absolute;
    bottom: 36px;
    right: 60px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: #A09C93;
    font-weight: 500;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card">
    <div class="logo">FE<span>4</span>Raccoons</div>
    <h1>Pass the FE Civil Exam.<br><em>Everything you need.</em></h1>
    <p>Problem-first learning with ELI5 explanations, handbook references, and exam-style practice.</p>
    <div class="stats">
      <div class="stat"><span class="stat-num">15</span><span class="stat-label">chapters</span></div>
      <div class="stat"><span class="stat-num">107</span><span class="stat-label">lessons</span></div>
      <div class="stat"><span class="stat-num">440+</span><span class="stat-label">problems</span></div>
    </div>
  </div>
  <div class="url">fe4raccoons.com</div>
</body>
</html>
