<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" fill="none">
  <!-- Triangle -->
  <polygon points="60,260 340,260 60,60" stroke="#2C2C2C" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

  <!-- Right angle marker -->
  <polyline points="60,230 90,230 90,260" stroke="#2C2C2C" stroke-width="2" fill="none"/>

  <!-- Angle theta arc -->
  <path d="M 295,260 A 45,45 0 0,0 318,238" stroke="#E8683A" stroke-width="2.5" fill="none"/>
  <text x="288" y="244" font-family="Inter, sans-serif" font-size="16" font-style="italic" fill="#E8683A">&#952;</text>

  <!-- Side labels -->
  <text x="30" y="168" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#2C2C2C" text-anchor="middle" transform="rotate(-90, 30, 168)">opposite</text>
  <text x="200" y="286" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#2C2C2C" text-anchor="middle">adjacent</text>
  <text x="220" y="148" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#2C2C2C" text-anchor="middle" transform="rotate(-55, 220, 148)">hypotenuse</text>

  <!-- Divider line -->
  <line x1="390" y1="70" x2="390" y2="250" stroke="#F5EDE0" stroke-width="1.5"/>

  <!-- SOH-CAH-TOA -->
  <text x="410" y="100" font-family="'DM Sans', sans-serif" font-size="13" font-weight="600" fill="#2C2C2C" letter-spacing="0.08em">SOH-CAH-TOA</text>

  <text x="410" y="140" font-family="'JetBrains Mono', monospace" font-size="13" fill="#2C2C2C">sin &#952; = opp / hyp</text>
  <text x="410" y="175" font-family="'JetBrains Mono', monospace" font-size="13" fill="#2C2C2C">cos &#952; = adj / hyp</text>
  <text x="410" y="210" font-family="'JetBrains Mono', monospace" font-size="13" fill="#2C2C2C">tan &#952; = opp / adj</text>
</svg>
