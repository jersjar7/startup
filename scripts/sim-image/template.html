<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Source of the exam simulation product pictures (public/exam-sim-*.png),
     rendered by scripts/gen-sim-image.mjs. The two question pages are real
     captures of the exam screen (the free preview: same screen and bank as the
     paid sitting). The books are the topics the simulation scores. The top
     book is ember so the raccoon's cream face and dark mask both stand out
     against it. No overall score, no pass badge, no
     price: Google shows the price beside the picture, and a sample score
     alone reads as a promise. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF9F0;
    --charcoal: #2C2C2C;
    --ember: #E8683A;
    --forest: #2D7A5F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: var(--w);
    height: var(--h);
    position: relative;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: var(--charcoal);
    /* Engineering pad under two pools of brand light. */
    background:
      radial-gradient(ellipse 55% 45% at 88% 18%, rgba(232,104,58,0.20), transparent 70%),
      radial-gradient(ellipse 60% 50% at 8% 100%, rgba(45,122,95,0.16), transparent 70%),
      linear-gradient(rgba(45,122,95,0.055) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(45,122,95,0.055) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--cream);
  }
  .words { position: absolute; }
  .logo {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.02em;
    margin-bottom: 26px;
  }
  .logo span { color: var(--ember); }
  h1 {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.035em;
  }
  .lead { margin-top: 22px; line-height: 1.45; color: #57524C; }
  .lead b { color: var(--charcoal); font-weight: 600; }

  /* A printed page: the capture sits on paper with a margin, a tight contact
     shadow and a wide one for height. */
  .page {
    position: absolute;
    background: #fff;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 1px 2px rgba(44,44,44,0.10), 0 3px 8px rgba(44,44,44,0.06), 0 24px 60px rgba(44,44,44,0.14);
  }
  .page img { display: block; width: 100%; }
  .page.back { filter: blur(0.7px) saturate(0.9); }
  .page.back::after {
    /* Pages further back sit in a little shade. */
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: rgba(255,249,240,0.28);
  }

  /* The topics as a stack of books, the weakest pulled half out. Spines are
     shaded like a rounded cover: light on the top edge, dark on the bottom. */
  .stack { position: absolute; }
  .book {
    position: relative;
    display: flex;
    align-items: center;
    height: var(--bh);
    width: calc(var(--w) * 1%);
    margin: calc(var(--bh) * -0.05) 0 0 calc(var(--x) * 1px);
    padding: 0 0 0 calc(var(--bh) * 0.45);
    border-radius: 7px 11px 11px 7px;
    transform: rotate(calc(var(--r) * 1deg));
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: var(--bf);
    letter-spacing: 0.11em;
    text-transform: uppercase;
    background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.16)), var(--c);
    color: var(--t);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.22), inset 0 -3px 0 rgba(0,0,0,0.12),
      0 2px 3px rgba(44,44,44,0.20), 0 12px 26px rgba(44,44,44,0.12);
  }
  /* Binding bands near the spine's end. */
  .book::before, .book::after {
    content: '';
    position: absolute;
    top: 22%;
    bottom: 22%;
    width: 4px;
    border-radius: 2px;
    background: var(--band);
  }
  .book::before { right: calc(var(--bh) * 0.62); }
  .book::after { right: calc(var(--bh) * 0.42); }
  .ch { --c: #2C2C2C; --t: #FFF9F0; --band: rgba(255,249,240,0.30); }
  .em { --c: #E8683A; --t: #FFFFFF; --band: rgba(255,255,255,0.45); }
  .fo { --c: #2D7A5F; --t: #FFFFFF; --band: rgba(255,255,255,0.38); }
  .cr { --c: #FFFDF8; --t: #2C2C2C; --band: rgba(44,44,44,0.22); }
  .sa { --c: #EADFCB; --t: #2C2C2C; --band: rgba(44,44,44,0.22); }

  /* The raccoon peeks over the top book, inside it so it tilts with the
     spine: flat bottom of its face on the edge, nose over the book. */
  .peek {
    position: absolute;
    top: 0;
    width: 230px;
    z-index: 3;
    /* The face's flat bottom ends 16.5% above the image's bottom; only the nose
       hangs below it. Seat the face exactly on the edge. */
    transform: translate(-50%, -83.5%);
    filter: drop-shadow(0 0 0.6px rgba(44,44,44,0.55)) drop-shadow(0 -2px 6px rgba(44,44,44,0.10));
  }

  /* ---- Square, 1200 x 1200 ---- */
  body.square { --w: 1200px; --h: 1200px; }
  .square .words { left: 84px; top: 84px; width: 520px; }
  .square h1 { font-size: 72px; }
  .square .lead { font-size: 24px; }
  .square .p1 { left: 690px; top: 60px; width: 460px; transform: rotate(6deg); }
  .square .p2 { left: 650px; top: 290px; width: 490px; transform: rotate(-3.5deg); }
  .square .stack { left: 70px; top: 672px; width: 700px; --bh: 64px; --bf: 22px; }
  .square .peek { left: 62%; }

  /* ---- 4:3, 1200 x 900 ---- */
  body.four { --w: 1200px; --h: 900px; }
  .four .words { left: 72px; top: 70px; width: 540px; }
  .four h1 { font-size: 62px; }
  .four .lead { font-size: 22px; }
  .four .p1 { left: 700px; top: 40px; width: 420px; transform: rotate(6deg); }
  .four .p2 { left: 640px; top: 220px; width: 450px; transform: rotate(-3.5deg); }
  .four .stack { left: 64px; top: 510px; width: 600px; --bh: 54px; --bf: 19px; }
  .four .peek { left: 63%; width: 200px; }

  /* ---- 16:9, 1600 x 900 ---- */
  body.wide { --w: 1600px; --h: 900px; }
  .wide .words { left: 96px; top: 230px; width: 600px; }
  .wide h1 { font-size: 76px; }
  .wide .lead { font-size: 25px; }
  .wide .p1 { left: 1110px; top: 40px; width: 430px; transform: rotate(7deg); }
  .wide .p2 { left: 1010px; top: 150px; width: 460px; transform: rotate(-3deg); }
  .wide .stack { left: 700px; top: 470px; width: 620px; --bh: 56px; --bf: 19px; }
  .wide .peek { left: 63%; width: 200px; }
</style>
</head>
<body class="square">
  <div class="words">
    <div class="logo">FE<span>4</span>Raccoons</div>
    <h1>Find your weakest topic before the FE does.</h1>
    <p class="lead">The full FE Civil exam simulation: <b>110 questions</b> on the real <b>5 h 20 min</b> clock, then a score for every topic, weakest first.</p>
  </div>

  <div class="page back p1"><img src="q-pavement.png" alt=""></div>
  <div class="page p2"><img src="q-beam.png" alt=""></div>

  <div class="stack">
    <div class="book em" style="--w:84;--x:18;--r:-1.2"><img class="peek" src="raccoon-peek.png" alt="">Structural</div>
    <div class="book cr" style="--w:90;--x:4;--r:0.9">Geotechnical</div>
    <div class="book ch" style="--w:90;--x:0;--r:-0.6">Fluid Mechanics</div>
    <div class="book fo" style="--w:86;--x:26;--r:0.8">Water Resources</div>
    <div class="book sa" style="--w:94;--x:6;--r:-0.4">Transportation</div>
    <div class="book ch" style="--w:88;--x:30;--r:0.5">Mechanics of Materials</div>
    <div class="book cr" style="--w:96;--x:0;--r:-0.3">Statics</div>
  </div>

  <script>
    const shape = new URLSearchParams(location.search).get('shape');
    if (shape) document.body.className = shape;
  </script>
</body>
</html>
