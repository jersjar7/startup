<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Source of the exam simulation product pictures (public/exam-sim-*.png),
     rendered by scripts/gen-sim-image.mjs. Every object is a real capture:
     two question pages from the exam screen (the free preview, same screen and
     bank as the paid sitting) and the score-by-chapter section of the results
     screen. No overall score, no pass badge, no price: Google shows the price
     beside the picture, and a sample score alone reads as a promise. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF9F0;
    --charcoal: #2C2C2C;
    --ember: #E8683A;
    --forest: #2D7A5F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: var(--w);
    height: var(--h);
    position: relative;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: var(--charcoal);
    /* Engineering pad under two pools of brand light. */
    background:
      radial-gradient(ellipse 55% 45% at 88% 18%, rgba(232,104,58,0.20), transparent 70%),
      radial-gradient(ellipse 60% 50% at 8% 100%, rgba(45,122,95,0.16), transparent 70%),
      linear-gradient(rgba(45,122,95,0.055) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(45,122,95,0.055) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--cream);
  }
  .words { position: absolute; }
  .logo {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.02em;
    margin-bottom: 26px;
  }
  .logo span { color: var(--ember); }
  h1 {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.035em;
  }
  .lead { margin-top: 22px; line-height: 1.45; color: #57524C; }
  .lead b { color: var(--charcoal); font-weight: 600; }

  /* A printed page: the capture sits on paper with a margin, a tight contact
     shadow and a wide one for height. */
  .page {
    position: absolute;
    background: #fff;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 1px 2px rgba(44,44,44,0.10), 0 3px 8px rgba(44,44,44,0.06), 0 24px 60px rgba(44,44,44,0.14);
  }
  .page img { display: block; width: 100%; }
  .page.back { filter: blur(0.7px) saturate(0.9); }
  .page.back::after {
    /* Pages further back sit in a little shade. */
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: rgba(255,249,240,0.28);
  }

  .report {
    position: absolute;
    background: #fff;
    border-radius: 18px;
    padding: 30px 32px 26px;
    border-top: 5px solid var(--ember);
    box-shadow: 0 2px 4px rgba(44,44,44,0.12), 0 6px 14px rgba(44,44,44,0.08), 0 36px 80px rgba(44,44,44,0.20);
  }
  .report img.shot { display: block; width: 100%; }
  /* The raccoon peeks over the report's top edge: flat bottom of its face on
     the edge, nose over the card. */
  .peek {
    position: absolute;
    top: 0;
    width: 230px;
    transform: translate(-50%, -100%) translateY(34px);
    filter: drop-shadow(0 0 0.6px rgba(44,44,44,0.55)) drop-shadow(0 -2px 6px rgba(44,44,44,0.10));
  }

  /* ---- Square, 1200 x 1200 ---- */
  body.square { --w: 1200px; --h: 1200px; }
  .square .words { left: 84px; top: 84px; width: 520px; }
  .square h1 { font-size: 72px; }
  .square .lead { font-size: 24px; }
  .square .p1 { left: 690px; top: 60px; width: 460px; transform: rotate(6deg); }
  .square .p2 { left: 650px; top: 290px; width: 490px; transform: rotate(-3.5deg); }
  .square .report { left: 60px; top: 690px; width: 820px; transform: rotate(-1.6deg); }
  .square .peek { left: 74%; }

  /* ---- 4:3, 1200 x 900 ---- */
  body.four { --w: 1200px; --h: 900px; }
  .four .words { left: 72px; top: 70px; width: 540px; }
  .four h1 { font-size: 62px; }
  .four .lead { font-size: 22px; }
  .four .p1 { left: 700px; top: 40px; width: 420px; transform: rotate(6deg); }
  .four .p2 { left: 640px; top: 220px; width: 450px; transform: rotate(-3.5deg); }
  .four .report { left: 64px; top: 520px; width: 700px; transform: rotate(-1.6deg); }
  .four .peek { left: 76%; width: 210px; }

  /* ---- 16:9, 1600 x 900 ---- */
  body.wide { --w: 1600px; --h: 900px; }
  .wide .words { left: 96px; top: 150px; width: 600px; }
  .wide h1 { font-size: 76px; }
  .wide .lead { font-size: 25px; }
  .wide .p1 { left: 1110px; top: 40px; width: 430px; transform: rotate(7deg); }
  .wide .p2 { left: 1010px; top: 150px; width: 460px; transform: rotate(-3deg); }
  .wide .report { left: 700px; top: 470px; width: 700px; transform: rotate(-1.6deg); }
  .wide .peek { left: 24%; width: 210px; }
</style>
</head>
<body class="square">
  <div class="words">
    <div class="logo">FE<span>4</span>Raccoons</div>
    <h1>Find your weakest topic before the FE does.</h1>
    <p class="lead">The full FE Civil exam simulation: <b>110 questions</b> on the real <b>5 h 20 min</b> clock, then a score for every topic, weakest first.</p>
  </div>

  <div class="page back p1"><img src="q-pavement.png" alt=""></div>
  <div class="page p2"><img src="q-beam.png" alt=""></div>

  <div class="report">
    <img class="peek" src="raccoon-peek.png" alt="">
    <img class="shot" src="score-by-chapter.png" alt="">
  </div>

  <script>
    const shape = new URLSearchParams(location.search).get('shape');
    if (shape) document.body.className = shape;
  </script>
</body>
</html>
